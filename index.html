<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#059669">
    <title>SI Masjid AL-IKHLAS</title>
    
    <link rel="manifest" id="pwa-manifest">
    <link rel="apple-touch-icon" id="apple-icon" href="https://lh3.googleusercontent.com/d/1APv_1jTkU07oSpkzle2UppS2fxlqTr0b">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f3f4f6; 
            margin: 0 !important; 
            padding: 0 !important; 
            overflow: hidden !important; 
        }
        .quran-text { font-size: 1.8rem; line-height: 2.5; font-family: 'Amiri', serif; text-align: right; }
        
        #masjid-app-wrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background-color: #111827; z-index: 2147483647; display: flex; justify-content: center;
        }
        #masjid-app-container {
            position: relative; width: 100%; max-width: 480px; height: 100%;
            background-color: #f9fafb; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        .blogger-thumbnail { display: none !important; }

        /* Bottom Sheet Transition */
        #more-menu-overlay { transition: opacity 0.3s ease; }
        #more-menu-sheet { transition: transform 0.3s ease-out; }
    </style>
</head>
<body>

    <img class="blogger-thumbnail" src="https://images.unsplash.com/photo-1564507004663-b6af65401761?q=80&w=1000&auto=format&fit=crop" alt="Thumbnail Masjid">

    <div id="masjid-app-wrapper">
        <div id="masjid-app-container">
            <!-- HEADER STANDAR -->
            <header class="bg-white z-40 shrink-0 border-b border-gray-200 sticky top-0 shadow-sm">
                <div class="px-4 h-16 flex items-center gap-3">
                    <img src="https://lh3.googleusercontent.com/d/1APv_1jTkU07oSpkzle2UppS2fxlqTr0b" id="app-logo-header" class="w-10 h-10 object-contain rounded-full border border-gray-100 p-0.5 shadow-sm" alt="Logo">
                    <div class="flex flex-col">
                        <h1 class="text-lg font-bold text-gray-800 leading-tight" id="nav-title">AL-IKHLAS</h1>
                        <p class="text-[10px] font-medium text-emerald-600 leading-none">Sistem Informasi Masjid</p>
                    </div>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 pb-24 bg-gray-50" id="main-content">
                <div id="loading-screen" class="h-full hidden flex-col items-center justify-center gap-3">
                    <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-200 border-t-emerald-600"></div>
                    <p class="text-sm text-gray-500 font-medium">Memuat data...</p>
                </div>
                <div id="view-container" class="space-y-2"></div>
            </main>

            <!-- BOTTOM NAVIGATION STANDAR -->
            <nav class="bg-white border-t border-gray-200 h-16 shrink-0 flex justify-around items-center px-1 z-40 absolute bottom-0 w-full shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
                <button onclick="loadView('beranda')" id="nav-beranda" class="nav-item text-emerald-600 flex flex-col items-center w-16 group transition-colors">
                    <i class="fa-solid fa-house text-xl mb-1 group-active:scale-95 transition-transform"></i>
                    <span class="text-[10px] font-semibold">Beranda</span>
                </button>
                <button onclick="loadView('jadwal')" id="nav-jadwal" class="nav-item text-gray-400 flex flex-col items-center w-16 group transition-colors">
                    <i class="fa-solid fa-clock text-xl mb-1 group-active:scale-95 transition-transform"></i>
                    <span class="text-[10px] font-semibold">Jadwal</span>
                </button>
                <button onclick="loadView('quran')" id="nav-quran" class="nav-item text-gray-400 flex flex-col items-center w-16 group transition-colors">
                    <i class="fa-solid fa-book-open text-xl mb-1 group-active:scale-95 transition-transform"></i>
                    <span class="text-[10px] font-semibold">Qur'an</span>
                </button>
                <button onclick="loadView('kas')" id="nav-kas" class="nav-item text-gray-400 flex flex-col items-center w-16 group transition-colors">
                    <i class="fa-solid fa-wallet text-xl mb-1 group-active:scale-95 transition-transform"></i>
                    <span class="text-[10px] font-semibold">Kas</span>
                </button>
                <button onclick="toggleMoreMenu()" class="nav-item text-gray-400 flex flex-col items-center w-16 group transition-colors">
                    <i class="fa-solid fa-bars text-xl mb-1 group-active:scale-95 transition-transform"></i>
                    <span class="text-[10px] font-semibold">Menu</span>
                </button>
            </nav>

            <!-- MENU OVERLAY -->
            <div id="more-menu-overlay" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 flex flex-col justify-end" onclick="toggleMoreMenu(true)">
                <div id="more-menu-sheet" class="bg-white w-full max-w-[480px] mx-auto rounded-t-3xl p-6 pb-8 transform translate-y-full" onclick="event.stopPropagation()">
                    <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-6"></div>
                    <div class="grid grid-cols-4 gap-y-6 gap-x-2">
                        <button onclick="loadView('yasin'); toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-book-quran text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Yasin</span></button>
                        <button onclick="loadView('khotib'); toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-microphone text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Khotib</span></button>
                        <button onclick="loadView('profil'); toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-mosque text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Profil</span></button>
                        <button onclick="loadView('zakat'); toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-sack-dollar text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Zakat</span></button>
                        <button onclick="loadView('qurban'); toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-cow text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Qurban</span></button>
                        <button onclick="loadView('infaq'); toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-hand-holding-heart text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Infaq</span></button>
                        <div id="auth-menu-container" class="contents"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
// KONFIGURASI PENTING
const IS_PREVIEW = false; 
const GAS_URL = "https://script.google.com/macros/s/AKfycbwS5p2mM1Ja1ZCo_g7Gg_j3iDoBtdto6srxumHAQrN2Zt_stxjNkQ0zgbLXfeKR2EvP/exec"; 
const LOGO_APP = "https://lh3.googleusercontent.com/d/1APv_1jTkU07oSpkzle2UppS2fxlqTr0b"; 

document.getElementById('app-logo-header').src = LOGO_APP;
document.getElementById('apple-icon').href = LOGO_APP;

let currentUser = null; 
let appData = { profil: {}, pengurus: {}, khotib: [], kas: [], zakat: [], qurban: [], zakatDist: [] };
let appInterval = null; 
let viewFilters = { kas: 'all', zakat: 'all', qurban: 'all' };

// VARIABEL STATUS ADMIN & CACHE
let activeAdminTab = ''; 
let activeAdminTitle = '';
let isFirstLoad = true;

const manifestData = { "name": "SI Masjid AL-IKHLAS", "short_name": "SI Masjid AL-IKHLAS", "start_url": ".", "display": "standalone", "theme_color": "#059669", "icons": [{ "src": LOGO_APP, "sizes": "512x512", "type": "image/png" }] };
document.getElementById('pwa-manifest').setAttribute('href', 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestData)));

// UTILS & HELPER
function formatRupiah(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0); }
function formatTanggalIndo(tglStr) {
    if(!tglStr) return '-'; let d = new Date(tglStr); if(isNaN(d.getTime())) return tglStr;
    const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov', 'Des'];
    return `${String(d.getDate()).padStart(2,'0')} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
}
function formatBulanTahun(YYYYMM) {
    if(!YYYYMM || YYYYMM === 'all') return ''; const [y, m] = YYYYMM.split('-');
    const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return `${bulan[parseInt(m)-1]} ${y}`;
}
function getN(val) {
    if (val === undefined || val === null || val === '') return 0;
    if (typeof val === 'number') return val;
    return parseFloat(val.toString().replace(/,/g, '.')) || 0;
}
function updateFilter(type, val) { viewFilters[type] = val; loadView(type); }
function updateNavTitle(titleStr) {
    const navTitle = document.getElementById('nav-title');
    if (navTitle) navTitle.innerText = titleStr ? titleStr.toUpperCase() : "AL-IKHLAS";
}
function copyToClipboard(text) {
    const el = document.createElement('textarea'); el.value = text;
    el.style.position = 'absolute'; el.style.left = '-9999px'; document.body.appendChild(el);
    el.select(); document.execCommand('copy'); document.body.removeChild(el);
    showToast('Disalin ke clipboard!', 'success');
}

// TOAST UI STANDAR
function showToast(msg, type = 'success') {
    let toast = document.getElementById('app-toast');
    if(!toast) { toast = document.createElement('div'); toast.id = 'app-toast'; document.getElementById('masjid-app-container').appendChild(toast); }
    toast.className = `absolute bottom-20 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-[99999] flex items-center gap-2 text-sm text-white w-max max-w-[90%] text-center ${type === 'error' ? 'bg-red-600' : 'bg-gray-800'}`;
    toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> <span>${msg}</span>`;

    requestAnimationFrame(() => { toast.classList.remove('opacity-0'); toast.classList.add('-translate-y-2'); });
    if(toast.timeoutId) clearTimeout(toast.timeoutId);
    toast.timeoutId = setTimeout(() => { toast.classList.add('opacity-0'); toast.classList.remove('-translate-y-2'); }, 3000);
}

// API HANDLER
async function fetchApp(action, payload = {}) {
    if (GAS_URL === "http://script.google.com/macros/s/AKfycbwS5p2mM1Ja1ZCo_g7Gg_j3iDoBtdto6srxumHAQrN2Zt_stxjNkQ0zgbLXfeKR2EvP/exec" || !GAS_URL.startsWith("http")) {
        if (action === 'getData') return { status: 'success', profil: appData.profil || {}, pengurus: appData.pengurus || {}, khotib: [], kas: [], zakat: [], qurban: [], zakatDist: [] };
        return { status: 'error', message: 'URL GAS belum disetel.' };
    }
    try {
        const formData = new URLSearchParams(); formData.append('action', action); formData.append('payload', JSON.stringify(payload));
        const res = await fetch(GAS_URL, { method: 'POST', body: formData });
        return await res.json();
    } catch (e) { return { status: 'error', message: 'Gagal memuat data' }; }
}

// FETCH DATA LATAR BELAKANG UNTUK MEMPERCEPAT BUKA APLIKASI
function loadDataBackground() {
    fetchApp('getData').then(res => {
        if(res && res.status === 'success') {
            appData = res;
            localStorage.setItem('masjidData', JSON.stringify(appData));
            updateNavTitle(appData.profil.nama);
        }
    }).catch(e => console.log('Bg fetch failed'));
}

function updateNavVisuals(viewId) {
    document.querySelectorAll('.nav-item').forEach(el => { el.classList.remove('text-emerald-600'); el.classList.add('text-gray-400'); });
    const active = document.getElementById(`nav-${viewId}`);
    if(active) { active.classList.add('text-emerald-600'); active.classList.remove('text-gray-400'); }
}

// TOGGLE MENU FUNGSI UTAMA
function toggleMoreMenu(close = false) {
    const overlay = document.getElementById('more-menu-overlay');
    const sheet = document.getElementById('more-menu-sheet');
    const authCon = document.getElementById('auth-menu-container');
    if (overlay.classList.contains('hidden') && !close) {
        if(authCon) {
            authCon.innerHTML = currentUser ? 
                `<button onclick="loadView('admin');toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-gray-100 text-gray-700 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-cog text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Admin</span></button>
                 <button onclick="currentUser=null;activeAdminTab='';loadView('beranda');toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-red-50 text-red-500 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-sign-out-alt text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Logout</span></button>` :
                `<button onclick="loadView('login');toggleMoreMenu();" class="flex flex-col items-center"><div class="w-12 h-12 bg-gray-100 text-gray-700 rounded-full flex items-center justify-center mb-2"><i class="fa-solid fa-user-shield text-lg"></i></div><span class="text-[10px] font-semibold text-gray-600">Login</span></button>`;
        }
        overlay.classList.remove('hidden');
        setTimeout(() => { overlay.classList.remove('opacity-0'); sheet.classList.remove('translate-y-full'); }, 10);
    } else {
        overlay.classList.add('opacity-0'); sheet.classList.add('translate-y-full');
        setTimeout(() => overlay.classList.add('hidden'), 300);
    }
}

async function loadView(viewId, force = false) {
    if (appInterval) { clearInterval(appInterval); appInterval = null; }
    updateNavVisuals(viewId);
    
    // Reset admin state jika keluar dari view admin
    if (viewId !== 'admin') { activeAdminTab = ''; activeAdminTitle = ''; }
    
    const container = document.getElementById('view-container');
    const loader = document.getElementById('loading-screen');
    
    // CACHE LOAD (Aplikasi Terbuka Instan)
    if (isFirstLoad) {
        const cached = localStorage.getItem('masjidData');
        if (cached) {
            appData = JSON.parse(cached);
            updateNavTitle(appData.profil.nama);
            loadDataBackground(); // Ambil update terbaru diam-diam
        }
        isFirstLoad = false;
    }
    
    // Mencegah block UI kecuali data benar-benar kosong
    if(force || !appData.profil.nama) {
        container.innerHTML = ''; loader.classList.remove('hidden'); loader.classList.add('flex');
        const res = await fetchApp('getData');
        if(res && res.status === 'success') { 
            appData = res; 
            localStorage.setItem('masjidData', JSON.stringify(appData)); 
            updateNavTitle(appData.profil.nama); 
        }
        loader.classList.add('hidden'); loader.classList.remove('flex');
    }
    
    container.style.opacity = '0';
    setTimeout(() => {
        switch(viewId) {
            case 'beranda': renderBeranda(container); break;
            case 'jadwal': renderJadwal(container); break;
            case 'khotib': renderKhotib(container); break;
            case 'quran': renderQuran(container); break;
            case 'yasin': renderYasinTahlil(container); break;
            case 'kas': renderKas(container); break;
            case 'profil': renderProfil(container); break;
            case 'zakat': renderZakat(container); break;
            case 'qurban': renderQurban(container); break;
            case 'infaq': renderInfaq(container); break;
            case 'login': renderLogin(container); break;
            case 'admin': renderAdmin(container); break;
        }
        container.style.transition = 'opacity 0.15s';
        container.style.opacity = '1';
    }, 10);
}

// -----------------------------------------------------------------------------
// RENDERERS - UI STANDAR
// -----------------------------------------------------------------------------
function renderBeranda(container) {
    let tM = appData.kas.filter(k => k.jenis === 'Masuk').reduce((s, k) => s + getN(k.nominal), 0);
    let tK = appData.kas.filter(k => k.jenis === 'Keluar').reduce((s, k) => s + getN(k.nominal), 0);
    let zB = appData.zakat.filter(z => z.satuan === 'Beras').reduce((s, z) => s + getN(z.jumlah), 0);
    let zU = appData.zakat.filter(z => z.satuan === 'Uang').reduce((s, z) => s + getN(z.jumlah), 0);
    let qS = appData.qurban.filter(q => q.hewan === 'Sapi').length;
    let qK = appData.qurban.filter(q => q.hewan !== 'Sapi').length;

    container.innerHTML = `
        <!-- HERO SALDO KAS -->
        <div class="bg-emerald-600 text-white rounded-2xl p-5 mb-5 shadow-md">
            <p class="text-xs text-emerald-100 mb-1">Assalamu'alaikum, Jamaah</p>
            <h2 class="text-xl font-bold mb-4">${appData.profil.nama || 'Masjid'}</h2>
            <div class="bg-white/20 rounded-xl p-3 flex justify-between items-center backdrop-blur-sm">
                <div>
                    <p class="text-[10px] text-emerald-100 mb-0.5">Saldo Kas Terkini</p>
                    <p class="text-xl font-bold">${formatRupiah(tM - tK)}</p>
                </div>
                <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-white text-lg"></i>
                </div>
            </div>
        </div>

        <!-- WAKTU LOKAL & JADWAL SHOLAT -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
                <i class="fa-regular fa-clock text-emerald-500 mb-2"></i>
                <p class="text-xs text-gray-500 mb-0.5 font-medium" id="live-date">Memuat...</p>
                <p class="text-lg font-bold text-gray-800" id="live-time">--:--</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
                <i class="fa-solid fa-mosque text-emerald-500 mb-2"></i>
                <p class="text-xs text-gray-500 mb-0.5 font-medium">Jadwal Sholat</p>
                <p class="text-lg font-bold text-gray-800" id="next-prayer">Memuat</p>
            </div>
        </div>

        <!-- QUICK MENU -->
        <h3 class="text-sm font-bold text-gray-800 mb-3 px-1">Akses Cepat</h3>
        <div class="grid grid-cols-5 gap-2 mb-6">
             <button onclick="loadView('quran')" class="bg-blue-50 py-3 rounded-xl border border-blue-100 flex flex-col items-center active:bg-blue-100">
                <i class="fa-solid fa-book-open text-blue-600 mb-2 text-lg"></i><span class="text-[10px] font-semibold text-blue-800 tracking-tight">Qur'an</span>
             </button>
             <button onclick="loadView('yasin')" class="bg-rose-50 py-3 rounded-xl border border-rose-100 flex flex-col items-center active:bg-rose-100">
                <i class="fa-solid fa-book-quran text-rose-600 mb-2 text-lg"></i><span class="text-[10px] font-semibold text-rose-800 tracking-tight">Yasin</span>
             </button>
             <button onclick="loadView('khotib')" class="bg-purple-50 py-3 rounded-xl border border-purple-100 flex flex-col items-center active:bg-purple-100">
                <i class="fa-solid fa-microphone text-purple-600 mb-2 text-lg"></i><span class="text-[10px] font-semibold text-purple-800 tracking-tight">Khotib</span>
             </button>
             <button onclick="loadView('kas')" class="bg-emerald-50 py-3 rounded-xl border border-emerald-100 flex flex-col items-center active:bg-emerald-100">
                <i class="fa-solid fa-file-invoice text-emerald-600 mb-2 text-lg"></i><span class="text-[10px] font-semibold text-emerald-800 tracking-tight">Laporan</span>
             </button>
             <button onclick="loadView('infaq')" class="bg-amber-50 py-3 rounded-xl border border-amber-100 flex flex-col items-center active:bg-amber-100">
                <i class="fa-solid fa-hand-holding-heart text-amber-500 mb-2 text-lg"></i><span class="text-[10px] font-semibold text-amber-800 tracking-tight">Infaq</span>
             </button>
        </div>

        <!-- REKAP ZAKAT & QURBAN -->
        <h3 class="text-sm font-bold text-gray-800 mb-3 px-1">Ringkasan Data</h3>
        <div class="grid grid-cols-2 gap-3 mb-2">
            <div onclick="loadView('zakat')" class="bg-teal-50 p-3 rounded-xl border border-teal-100 active:bg-teal-100 cursor-pointer">
                <div class="flex items-center gap-2 mb-2">
                    <div class="bg-white w-6 h-6 rounded shadow-sm flex items-center justify-center"><i class="fa-solid fa-sack-dollar text-teal-600 text-[10px]"></i></div>
                    <span class="text-xs font-bold text-teal-900">Zakat Fitrah</span>
                </div>
                <p class="text-sm font-bold text-teal-800">${zB} <span class="text-[10px] font-medium text-teal-600">Kg Beras</span></p>
                <p class="text-sm font-bold text-teal-600 mt-0.5">${formatRupiah(zU)}</p>
            </div>
            <div onclick="loadView('qurban')" class="bg-orange-50 p-3 rounded-xl border border-orange-100 active:bg-orange-100 cursor-pointer">
                <div class="flex items-center gap-2 mb-2">
                    <div class="bg-white w-6 h-6 rounded shadow-sm flex items-center justify-center"><i class="fa-solid fa-cow text-orange-500 text-[10px]"></i></div>
                    <span class="text-xs font-bold text-orange-900">Qurban</span>
                </div>
                <p class="text-sm font-bold text-orange-800">${qS} <span class="text-[10px] font-medium text-orange-600">Sapi</span></p>
                <p class="text-sm font-bold text-orange-600 mt-0.5">${qK} <span class="text-[10px] font-medium text-orange-600">Kambing</span></p>
            </div>
        </div>
    `;

    const updateTimeUI = () => {
        const now = new Date();
        const timeEl = document.getElementById('live-time');
        const dateEl = document.getElementById('live-date');
        if (timeEl) timeEl.innerText = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        if (dateEl) dateEl.innerText = formatTanggalIndo(now);
    };
    updateTimeUI(); 
    appInterval = setInterval(updateTimeUI, 1000); 

    fetch(`https://api.aladhan.com/v1/timingsByCity?city=Sragen&country=Indonesia&method=11`)
    .then(r=>r.json()).then(d => {
        const t = d.data.timings;
        const now = new Date();
        const mins = now.getHours() * 60 + now.getMinutes();
        const p = [{n:'Subuh',v:t.Fajr},{n:'Dzuhur',v:t.Dhuhr},{n:'Ashar',v:t.Asr},{n:'Maghrib',v:t.Maghrib},{n:'Isya',v:t.Isha}];
        let next = p.find(x => { let [h,m] = x.v.split(':').map(Number); return (h*60+m) > mins; });
        if(!next) next = p[0];
        const nEl = document.getElementById('next-prayer');
        if (nEl) nEl.innerText = `${next.n} ${next.v}`;
    }).catch(e => console.log(e));
}

let currentPlayingBtn = null;

function resetAudioIcon() {
    if (!currentPlayingBtn) return;
    const icon = currentPlayingBtn.querySelector('i');
    if (icon) {
        icon.classList.remove('fa-pause');
        icon.classList.add('fa-play');
    }
    const textSpan = currentPlayingBtn.querySelector('.play-text');
    if (textSpan && textSpan.innerText.includes('Jeda')) {
        textSpan.innerText = textSpan.innerText.replace('Jeda', 'Putar');
    }
}

function playAudio(url, btn) {
    const audio = document.getElementById('quran-audio');
    
    // Mencegah isu perbedaan deteksi absolute vs relative URL
    const isSameAudio = audio.src.includes(url);
    
    // Jika audio yang berbeda dimainkan, kembalikan ikon sebelumnya
    if(!isSameAudio) {
        resetAudioIcon();
        
        // Pause secara eksplisit sebelum ganti src agar memutus Promise sebelumnya
        if(!audio.paused) {
            audio.pause(); 
        }
        
        audio.src = url;
        currentPlayingBtn = btn;
    }
    
    const icon = btn.querySelector('i');
    const textSpan = btn.querySelector('.play-text');
    
    if(audio.paused) {
        // audio.play() mengembalikan sebuah Promise. Kita harus menangkap errornya
        // jika pemutaran dibatalkan (misal: user klik tombol pause terlalu cepat)
        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                if (icon) { icon.classList.remove('fa-play'); icon.classList.add('fa-pause'); }
                if (textSpan) textSpan.innerText = textSpan.innerText.replace('Putar', 'Jeda');
            }).catch(error => {
                console.log("Pemutaran audio diinterupsi dengan aman:", error);
            });
        }
    } else {
        audio.pause();
        if (icon) { icon.classList.remove('fa-pause'); icon.classList.add('fa-play'); }
        if (textSpan) textSpan.innerText = textSpan.innerText.replace('Jeda', 'Putar');
    }
    
    // Kembalikan ke ikon play otomatis saat audio selesai
    audio.onended = () => {
        resetAudioIcon();
        currentPlayingBtn = null;
    };
}

// LOGIKA NAVIGASI ADMIN PANEL BARU
function openAdminMenu(id, title) {
    activeAdminTab = id; 
    activeAdminTitle = title;
    
    // Sembunyikan grid menu utama
    document.getElementById('admin-main').classList.add('hidden');
    document.getElementById('admin-main').classList.remove('block');
    
    // Tampilkan panel detail form
    document.getElementById('admin-detail').classList.remove('hidden');
    document.getElementById('admin-detail').classList.add('block');
    document.getElementById('admin-detail-title').innerText = title;
    
    // Sembunyikan semua konten form dan tampilkan yang dipilih
    document.querySelectorAll('.a-con').forEach(x => {
        x.classList.add('hidden');
        x.classList.remove('block');
    });
    
    document.getElementById(id).classList.remove('hidden');
    document.getElementById(id).classList.add('block');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeAdminMenu() {
    activeAdminTab = ''; 
    activeAdminTitle = '';
    
    // Sembunyikan detail dan kembali ke grid menu
    document.getElementById('admin-detail').classList.add('hidden');
    document.getElementById('admin-detail').classList.remove('block');
    document.getElementById('admin-main').classList.remove('hidden');
    document.getElementById('admin-main').classList.add('block');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function v(id) { const el = document.getElementById(id); return el ? el.value : ''; }

async function save(e, act, p) {
    if(act === 'addKas' && (!p.tanggal || !p.kategori || !p.keterangan || p.nominal <= 0)) { showToast('Isi Tanggal, Kategori, Keterangan & Nominal!', 'error'); return; }
    if(act === 'addZakat' && (!p.tanggal || !p.nama || p.jumlah <= 0)) { showToast('Isi Tanggal, Nama & Jumlah!', 'error'); return; }
    if(act === 'addZakatDist' && (!p.tahun || p.jumlah <= 0)) { showToast('Isi Tahun & Jumlah!', 'error'); return; }
    if(act === 'addQurban' && (!p.tahun || !p.nama)) { showToast('Isi Tahun & Nama!', 'error'); return; }

    const btn = e.currentTarget; const origText = btn.innerHTML;
    btn.innerHTML = '<div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent mr-2"></div> Memproses...';
    btn.disabled = true; btn.classList.add('opacity-80');

    // MENGIRIM KE GOOGLE SPREADSHEET (Hanya butuh ~1 detik)
    const res = await fetchApp(act, p);
    btn.innerHTML = origText; btn.disabled = false; btn.classList.remove('opacity-80');

    if(res && res.status === 'success') {
        // PEMBARUAN DATA LOKAL SECARA OPTIMIS (INSTAN! Tanpa perlu download ulang semua sheet)
        p.id = res.id; 
        if(act === 'addKas') { appData.kas.push(p); document.getElementById('kas-k').value = ''; document.getElementById('kas-n').value = ''; }
        if(act === 'addKhotib') { appData.khotib.push(p); document.getElementById('kho-n').value = ''; document.getElementById('kho-te').value = ''; }
        if(act === 'addZakat') { appData.zakat.push(p); document.getElementById('zak-n').value = ''; document.getElementById('zak-ju').value = ''; }
        if(act === 'addZakatDist') { appData.zakatDist.push(p); document.getElementById('zdist-j').value = ''; }
        if(act === 'addQurban') { appData.qurban.push(p); document.getElementById('qur-n').value = ''; document.getElementById('qur-k').value = ''; }
        if(act === 'saveProfil') appData.profil = { ...appData.profil, ...p };
        if(act === 'savePengurus') appData.pengurus = { ...appData.pengurus, ...p };

        localStorage.setItem('masjidData', JSON.stringify(appData));
        await loadView('admin', false); // Render ulang otomatis kilat
        showToast('Berhasil disimpan', 'success');
    } else { 
        showToast(res.message || 'Gagal disimpan, periksa koneksi', 'error'); 
    }
}

async function del(e, act, id) {
    if(!confirm('Yakin ingin menghapus data ini secara permanen?')) return;
    const btn = e.currentTarget; const origHtml = btn.innerHTML;
    btn.innerHTML = '<div class="animate-spin rounded-full h-3 w-3 border-2 border-red-500 border-t-transparent"></div>'; btn.disabled = true;

    const res = await fetchApp(act, { id });
    if(res && res.status === 'success') {
        // HAPUS LOKAL SECARA OPTIMIS (INSTAN!)
        if (act === 'deleteKas') appData.kas = appData.kas.filter(x => x.id != id);
        if (act === 'deleteKhotib') appData.khotib = appData.khotib.filter(x => x.id != id);
        if (act === 'deleteZakat') appData.zakat = appData.zakat.filter(x => x.id != id);
        if (act === 'deleteZakatDist') appData.zakatDist = appData.zakatDist.filter(x => x.id != id);
        if (act === 'deleteQurban') appData.qurban = appData.qurban.filter(x => x.id != id);

        localStorage.setItem('masjidData', JSON.stringify(appData));
        await loadView('admin', false); 
        showToast('Berhasil dihapus', 'success');
    } else {
        showToast(res.message || 'Gagal menghapus', 'error'); btn.innerHTML = origHtml; btn.disabled = false;
    }
}

window.onload = () => loadView('beranda');
</script>
